<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Books - Central Library</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), 
                        url('offline_resources/space-background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, white, transparent),
                radial-gradient(2px 2px at 60% 70%, white, transparent),
                radial-gradient(1px 1px at 50% 50%, white, transparent),
                radial-gradient(1px 1px at 80% 10%, white, transparent),
                radial-gradient(2px 2px at 90% 60%, white, transparent),
                radial-gradient(1px 1px at 33% 80%, white, transparent),
                radial-gradient(1px 1px at 15% 55%, white, transparent);
            background-size: 200% 200%;
            background-position: 0% 0%;
            animation: twinkle 4s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(118, 75, 162, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
        }

        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1em;
        }

        .controls {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            color: #ffffff;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-box input:focus {
            outline: none;
            border-color: rgba(102, 126, 234, 0.8);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }

        .filter-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(5px);
            color: rgba(255, 255, 255, 0.9);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.95em;
        }

        .filter-btn:hover {
            background: rgba(102, 126, 234, 0.3);
            border-color: rgba(102, 126, 234, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .filter-btn.active {
            background: rgba(102, 126, 234, 0.5);
            border-color: rgba(102, 126, 234, 0.8);
            color: #ffffff;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
        }

        .stats {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            margin-bottom: 35px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 25px;
            position: relative;
            z-index: 2;
            transition: all 0.3s ease;
        }
        
        .stats:hover {
            border-color: rgba(102, 126, 234, 0.3);
            box-shadow: 0 12px 45px rgba(102, 126, 234, 0.2);
        }

        .stat-item {
            text-align: center;
            transition: transform 0.3s ease;
        }
        
        .stat-item:hover {
            transform: translateY(-5px);
        }

        .stat-item .number {
            font-size: 2.8em;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(102, 126, 234, 0.7);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-item .label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-top: 8px;
            font-weight: 600;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
            position: relative;
            z-index: 2;
        }

        .book-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 18px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .book-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 15px 50px rgba(102, 126, 234, 0.4);
            border-color: rgba(102, 126, 234, 0.4);
        }

        .book-card:nth-child(2n) {
            animation-delay: 1s;
        }

        .book-card:nth-child(3n) {
            animation-delay: 2s;
        }

        .book-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 15px 50px rgba(102, 126, 234, 0.5);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(102, 126, 234, 0.5);
        }

        .book-cover {
            width: 100%;
            height: 320px;
            object-fit: cover;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3em;
            position: relative;
        }

        .book-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .book-cover .placeholder {
            font-size: 4em;
        }

        .availability-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .available {
            background: rgba(76, 175, 80, 0.3);
            color: #4caf50;
            border: 1px solid rgba(76, 175, 80, 0.5);
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        .limited {
            background: rgba(255, 152, 0, 0.3);
            color: #ff9800;
            border: 1px solid rgba(255, 152, 0, 0.5);
        }

        .unavailable {
            background: rgba(244, 67, 54, 0.3);
            color: #f44336;
            border: 1px solid rgba(244, 67, 54, 0.5);
        }

        .book-info {
            padding: 20px;
        }

        .book-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .book-author {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1em;
            margin-bottom: 12px;
        }

        .book-meta {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 15px 0;
            font-size: 0.9em;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.7);
        }

        .meta-item i {
            width: 20px;
            color: #667eea;
            filter: drop-shadow(0 0 5px rgba(102, 126, 234, 0.5));
        }

        .category-badge {
            display: inline-block;
            padding: 5px 12px;
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
            border: 1px solid rgba(102, 126, 234, 0.4);
            border-radius: 15px;
            font-size: 0.85em;
            margin-bottom: 10px;
            backdrop-filter: blur(10px);
            text-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
        }

        .book-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #667eea;
            border: 2px solid rgba(102, 126, 234, 0.5);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #667eea;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .no-books {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .no-books i {
            font-size: 5em;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.3));
        }

        .no-books h2 {
            color: #ffffff;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .no-books p {
            color: rgba(255, 255, 255, 0.7);
        }

        .loading {
            text-align: center;
            padding: 60px;
            font-size: 1.5em;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: rgba(26, 10, 46, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.3s ease;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            padding: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            color: #ffffff;
            font-size: 1.8em;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 2em;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            line-height: 1;
            padding: 0;
            width: 30px;
            height: 30px;
            transition: all 0.3s;
        }

        .close-btn:hover {
            color: #ffffff;
            text-shadow: 0 0 15px rgba(102, 126, 234, 0.8);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 25px;
        }

        .book-detail-cover {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 5em;
        }

        .book-detail-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-section h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.2em;
            text-shadow: 0 0 15px rgba(102, 126, 234, 0.5);
        }

        .detail-section p {
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .detail-item {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
        }

        .detail-item label {
            display: block;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85em;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .detail-item span {
            color: #ffffff;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .controls {
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }

            .books-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 15px;
            }

            .stats {
                flex-direction: column;
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1><i class="fas fa-book"></i> Library Books</h1>
            <p>Browse and discover books from our collection</p>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-item">
                <div class="number" id="totalBooks">0</div>
                <div class="label">Total Books</div>
            </div>
            <div class="stat-item">
                <div class="number" id="availableBooks">0</div>
                <div class="label">Available</div>
            </div>
            <div class="stat-item">
                <div class="number" id="totalCategories">0</div>
                <div class="label">Categories</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Search by title, author, or ISBN...">
            </div>
            <div class="filter-group" id="categoryFilters">
                <button class="filter-btn active" data-category="all">All Books</button>
            </div>
        </div>

        <!-- Books Grid -->
        <div id="booksContainer">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i> Loading books...
            </div>
        </div>
    </div>

    <!-- Book Detail Modal -->
    <div class="modal" id="bookModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Book Details</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Content will be populated dynamically -->
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let allBooks = [];
        let allCategories = [];
        let currentFilter = 'all';

        // Load initial data
        async function loadData() {
            try {
                await Promise.all([
                    loadCategories(),
                    loadBooks()
                ]);
            } catch (error) {
                console.error('Error loading data:', error);
                showError('Failed to load library data');
            }
        }

        async function loadCategories() {
            try {
                const response = await fetch(`${API_BASE}/books/categories`);
                const data = await response.json();
                
                if (data.success) {
                    allCategories = data.data.categories;
                    renderCategoryFilters();
                    updateStats();
                }
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }

        async function loadBooks(categoryId = null, searchQuery = null) {
            try {
                let url = `${API_BASE}/books`;
                const params = new URLSearchParams();
                
                if (categoryId && categoryId !== 'all') {
                    params.append('category_id', categoryId);
                }
                if (searchQuery) {
                    params.append('search', searchQuery);
                }
                
                if (params.toString()) {
                    url += `?${params.toString()}`;
                }

                const response = await fetch(url);
                const data = await response.json();
                
                if (data.success) {
                    allBooks = data.data.books;
                    renderBooks();
                    updateStats();
                }
            } catch (error) {
                console.error('Error loading books:', error);
                showError('Failed to load books');
            }
        }

        function renderCategoryFilters() {
            const container = document.getElementById('categoryFilters');
            const allBooksBtn = container.querySelector('[data-category="all"]');
            
            allCategories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.setAttribute('data-category', cat.id);
                btn.textContent = cat.name;
                btn.onclick = () => filterByCategory(cat.id);
                container.appendChild(btn);
            });
        }

        function filterByCategory(categoryId) {
            currentFilter = categoryId;
            
            // Update active button
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-category') == categoryId) {
                    btn.classList.add('active');
                }
            });
            
            loadBooks(categoryId, document.getElementById('searchInput').value);
        }

        function renderBooks() {
            const container = document.getElementById('booksContainer');
            
            if (allBooks.length === 0) {
                container.innerHTML = `
                    <div class="no-books">
                        <i class="fas fa-book-open"></i>
                        <h2>No books found</h2>
                        <p>Try adjusting your search or filters</p>
                    </div>
                `;
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'books-grid';

            allBooks.forEach(book => {
                const card = createBookCard(book);
                grid.appendChild(card);
            });

            container.innerHTML = '';
            container.appendChild(grid);
        }

        function createBookCard(book) {
            const card = document.createElement('div');
            card.className = 'book-card';
            card.onclick = () => showBookDetails(book);

            const availabilityClass = book.available_copies > 3 ? 'available' : 
                                     book.available_copies > 0 ? 'limited' : 'unavailable';
            const availabilityText = book.available_copies > 0 ? 
                                    `${book.available_copies} Available` : 'Unavailable';

            card.innerHTML = `
                <div class="book-cover">
                    ${book.cover_image_url ? 
                        `<img src="${book.cover_image_url}" alt="${book.title}">` : 
                        `<span class="placeholder">📚</span>`
                    }
                    <span class="availability-badge ${availabilityClass}">${availabilityText}</span>
                </div>
                <div class="book-info">
                    ${book.category_name ? `<span class="category-badge">${book.category_name}</span>` : ''}
                    <div class="book-title">${book.title}</div>
                    <div class="book-author">by ${book.author}</div>
                    
                    <div class="book-meta">
                        ${book.shelf_number ? `
                            <div class="meta-item">
                                <i class="fas fa-map-marker-alt"></i>
                                <span>Shelf ${book.shelf_number}${book.rack_number ? `, Rack ${book.rack_number}` : ''}</span>
                            </div>
                        ` : ''}
                        <div class="meta-item">
                            <i class="fas fa-copy"></i>
                            <span>${book.available_copies} of ${book.total_copies} copies</span>
                        </div>
                    </div>

                    <div class="book-actions">
                        <button class="btn btn-primary" onclick="event.stopPropagation(); issueBook(${book.id})" 
                                ${book.available_copies <= 0 ? 'disabled' : ''}>
                            <i class="fas fa-book-reader"></i> Borrow
                        </button>
                        ${book.online_resource_link ? `
                            <a href="${book.online_resource_link}" target="_blank" class="btn btn-secondary" 
                               onclick="event.stopPropagation()">
                                <i class="fas fa-link"></i> Online
                            </a>
                        ` : ''}
                    </div>
                </div>
            `;

            return card;
        }

        function showBookDetails(book) {
            const modal = document.getElementById('bookModal');
            const modalBody = document.getElementById('modalBody');

            modalBody.innerHTML = `
                <div class="book-detail-cover">
                    ${book.cover_image_url ? 
                        `<img src="${book.cover_image_url}" alt="${book.title}">` : 
                        `<span>📚</span>`
                    }
                </div>

                <div class="detail-section">
                    <h3>${book.title}</h3>
                    <p style="font-size: 1.2em; color: #667eea;">by ${book.author}</p>
                </div>

                ${book.description ? `
                    <div class="detail-section">
                        <h3>Description</h3>
                        <p>${book.description}</p>
                    </div>
                ` : ''}

                <div class="detail-section">
                    <h3>Book Information</h3>
                    <div class="detail-grid">
                        ${book.isbn ? `
                            <div class="detail-item">
                                <label>ISBN</label>
                                <span>${book.isbn}</span>
                            </div>
                        ` : ''}
                        ${book.publisher ? `
                            <div class="detail-item">
                                <label>Publisher</label>
                                <span>${book.publisher}</span>
                            </div>
                        ` : ''}
                        ${book.publication_year ? `
                            <div class="detail-item">
                                <label>Year</label>
                                <span>${book.publication_year}</span>
                            </div>
                        ` : ''}
                        ${book.category_name ? `
                            <div class="detail-item">
                                <label>Category</label>
                                <span>${book.category_name}</span>
                            </div>
                        ` : ''}
                        ${book.shelf_number ? `
                            <div class="detail-item">
                                <label>Location</label>
                                <span>Shelf ${book.shelf_number}${book.rack_number ? `, Rack ${book.rack_number}` : ''}</span>
                            </div>
                        ` : ''}
                        <div class="detail-item">
                            <label>Availability</label>
                            <span style="color: ${book.available_copies > 0 ? '#4caf50' : '#f44336'}">
                                ${book.available_copies} of ${book.total_copies} available
                            </span>
                        </div>
                    </div>
                </div>

                <div class="book-actions" style="margin-top: 25px;">
                    <button class="btn btn-primary" onclick="issueBook(${book.id})" 
                            ${book.available_copies <= 0 ? 'disabled' : ''}>
                        <i class="fas fa-book-reader"></i> Borrow This Book
                    </button>
                    ${book.online_resource_link ? `
                        <a href="${book.online_resource_link}" target="_blank" class="btn btn-secondary">
                            <i class="fas fa-external-link-alt"></i> View Online Resource
                        </a>
                    ` : ''}
                </div>
            `;

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('bookModal').classList.remove('active');
        }

        async function issueBook(bookId) {
            try {
                const response = await fetch(`${API_BASE}/books/${bookId}/issue`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ due_days: 14 })
                });

                const data = await response.json();

                if (data.success) {
                    alert('✅ Book issued successfully! Due date: 14 days from today.');
                    closeModal();
                    loadBooks(currentFilter, document.getElementById('searchInput').value);
                } else {
                    alert('❌ ' + (data.error || 'Failed to issue book. Please login first.'));
                }
            } catch (error) {
                console.error('Error issuing book:', error);
                alert('❌ Failed to issue book. Please try again.');
            }
        }

        function updateStats() {
            document.getElementById('totalBooks').textContent = allBooks.length;
            document.getElementById('availableBooks').textContent = 
                allBooks.filter(b => b.available_copies > 0).length;
            document.getElementById('totalCategories').textContent = allCategories.length;
        }

        function showError(message) {
            document.getElementById('booksContainer').innerHTML = `
                <div class="no-books">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h2>Error</h2>
                    <p>${message}</p>
                </div>
            `;
        }

        // Search functionality
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                loadBooks(currentFilter, e.target.value);
            }, 500);
        });

        // Close modal on outside click
        document.getElementById('bookModal').addEventListener('click', (e) => {
            if (e.target.id === 'bookModal') {
                closeModal();
            }
        });

        // Initialize
        loadData();
    </script>
</body>
</html>
